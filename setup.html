<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenChannel — owner code setup</title>
<style>
  body{margin:0;background:#101418;color:#e8edf2;font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:40px 16px}
  .card{max-width:420px;width:100%;background:#171d24;border:1px solid #2a333e;border-radius:14px;padding:22px}
  h1{font-size:18px;margin:0 0 6px}
  p{color:#8b97a3;margin:0 0 14px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid #2a333e;background:#1d242d;color:#e8edf2;font-size:16px;box-sizing:border-box}
  button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:#3ea6ff;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  #out{margin-top:14px;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;color:#5df2a6;display:none;background:#0b1f16;padding:10px;border-radius:8px}
</style>
</head>
<body>
<div class="card">
  <h1>Owner code setup</h1>
  <p>Type the owner code. Only its fingerprint (SHA-256 hash) is shown — the code itself never leaves this page.</p>
  <input type="password" id="code" autocomplete="off" placeholder="Owner code">
  <button id="go" type="button">Compute fingerprint</button>
  <div id="out"></div>
</div>
<script>
document.getElementById('go').onclick = async function(){
  var v = document.getElementById('code').value;
  if(!v) return;
  var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
  var h = Array.prototype.map.call(new Uint8Array(b), function(x){return ('0'+x.toString(16)).slice(-2);}).join('');
  var o = document.getElementById('out');
  o.style.display = 'block';
  o.textContent = h;
  document.getElementById('code').value = '';
};
</script>
</body>
</html>
